<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Craft em 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #87CEEB;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
            font-size: 14px;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            border: 2px solid white;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="info">
        <strong>Mini Craft 3D</strong><br>
        • <b>WASD</b>: Andar<br>
        • <b>Espaço</b>: Pular<br>
        • <b>Mouse</b>: Olhar ao redor<br>
        • <b>Clique Esquerdo</b>: Quebrar bloco<br>
        • <b>Clique Direito</b>: Colocar bloco<br>
        • <i>Clique na tela para começar</i>
    </div>
    <div id="crosshair"></div>

    <!-- Importando Three.js e PointerLockControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        const blocks = [];
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Variáveis de movimento
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        let canJump = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();

        init();
        animate();

        function init() {
            // Cena e Câmera
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Cor de céu
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 15);

            // Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Controles de Câmera (Mouse Look)
            controls = new THREE.PointerLockControls(camera, document.body);

            document.body.addEventListener('click', () => {
                controls.lock();
            });

            scene.add(controls.getObject());

            // Ouvintes de Teclado
            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyD': moveRight = true; break;
                    case 'Space':
                        if (canJump === true) velocity.y += 8;
                        canJump = false;
                        break;
                }
            };

            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyD': moveRight = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            // Ouvintes de Mouse (Quebrar e Colocar Blocos)
            window.addEventListener('mousedown', onMouseDown);

            // Luzes
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Geometria e Textura Básica dos Blocos
            const geometry = new THREE.BoxGeometry(2, 2, 2);

            // Criando o Mundo (Plano de grama e algumas árvores simples)
            const grassMaterial = new THREE.MeshLambertMaterial({ color: 0x55aa55 });
            const dirtMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
            const woodMaterial = new THREE.MeshLambertMaterial({ color: 0xA0522D });
            const leavesMaterial = new THREE.MeshLambertMaterial({ color: 0x2E8B57 });

            // Chão (Grama sobre Terra)
            for (let x = -10; x <= 10; x++) {
                for (let z = -10; z <= 10; z++) {
                    createBlock(x * 2, -2, z * 2, grassMaterial);
                    createBlock(x * 2, -4, z * 2, dirtMaterial);
                }
            }

            // Criar uma árvore de exemplo
            createBlock(0, 0, 0, woodMaterial);
            createBlock(0, 2, 0, woodMaterial);
            createBlock(0, 4, 0, leavesMaterial);
            createBlock(2, 4, 0, leavesMaterial);
            createBlock(-2, 4, 0, leavesMaterial);
            createBlock(0, 4, 2, leavesMaterial);
            createBlock(0, 4, -2, leavesMaterial);

            window.addEventListener('resize', onWindowResize);
        }

        function createBlock(x, y, z, material) {
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            blocks.push(mesh);
            return mesh;
        }

        function onMouseDown(event) {
            if (!controls.isLocked) return;

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(blocks);

            if (intersects.length > 0) {
                const intersect = intersects[0];

                if (event.button === 0) {
                    // Clique Esquerdo: Remover Bloco
                    scene.remove(intersect.object);
                    const index = blocks.indexOf(intersect.object);
                    if (index > -1) blocks.splice(index, 1);
                } else if (event.button === 2) {
                    // Clique Direito: Adicionar Bloco
                    const position = new THREE.Vector3().copy(intersect.point).add(intersect.face.normal);
                    
                    // Alinha à grade de blocos (tamanho 2)
                    position.x = Math.round(position.x / 2) * 2;
                    position.y = Math.round(position.y / 2) * 2;
                    position.z = Math.round(position.z / 2) * 2;

                    const newMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 }); // Bloco de terra/marrom
                    createBlock(position.x, position.y, position.z, newMaterial);
                }
            }
        }

        // Desativar menu de contexto do botão direito do mouse
        window.addEventListener('contextmenu', e => e.preventDefault());

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();

            if (controls.isLocked === true) {
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 5.0 * delta; // Gravidade

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                controls.getObject().position.y += (velocity.y * delta);

                // Colisão simples com o chão do mundo
                if (controls.getObject().position.y < 2) {
                    velocity.y = 0;
                    controls.getObject().position.y = 2;
                    canJump = true;
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
